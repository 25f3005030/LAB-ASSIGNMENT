<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Enter Details{% endblock %}</title>
</head>
<body>
    <h1>Enter the details</h1>

    <form method="POST" action="/" id = "data-form">
    <input type="radio" name="ID" value="student_id" {%if id_type== 'student_id'%}checked{%endif%}/>
    <label>Student ID</label>
    <input type="radio" name="ID" value="course_id" {%if id_type== 'course_id'%}checked{%endif%}/>
    <label>Course ID</label>
    <input type="text" name="id_value" />
    <input type="submit" value="Submit" />
    </form>
</body>
</html>
